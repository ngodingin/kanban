name: CI

on:
  push:
    branches: [main, stag]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Migration smoke (Global DB ephemeral)
        run: pnpm --filter @kanban/infrastructure migrate:global
        env:
          GLOBAL_DB_URL: file:///tmp/ci-global.db
          GLOBAL_DB_TOKEN: ci-local-placeholder
      - name: Migration fan-out smoke (0 project)
        run: pnpm --filter @kanban/infrastructure migrate:projects
        env:
          GLOBAL_DB_URL: file:///tmp/ci-global.db
          GLOBAL_DB_TOKEN: ci-local-placeholder
