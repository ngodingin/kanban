version: '3.8'
services:
  app:
    image: node:24-slim
    container_name: kanban-dev-app
    working_dir: /workspace
    volumes:
      - ./:/workspace:cached
      - /workspace/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: sh -c "npm ci && npx ts-node src/server.ts"
    restart: unless-stopped
